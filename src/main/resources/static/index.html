<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KLS GIT Belgaum — Sign In</title>
  <meta name="description" content="Sign in to the KLS Gogte Institute of Technology Campus Activity Hub. Manage events, clubs, and student activities." />
  <link rel="icon" type="image/png" href="/images/kls_git_logo.png" />
  <link rel="stylesheet" href="/css/style.css?v=20260917_v19" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
    }

    .auth-page-wrapper {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Left branding panel */
    .auth-brand-panel {
      flex: 1;
      background:
        linear-gradient(180deg,
          rgba(10, 12, 32, 0.50) 0%,
          rgba(10, 12, 32, 0.30) 35%,
          rgba(10, 12, 32, 0.50) 75%,
          rgba(10, 12, 32, 0.75) 100%
        ),
        url('/images/kls_git_campus.jpg') center 35% / cover no-repeat;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      position: relative;
      overflow: hidden;
    }

    .auth-brand-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% 50%, rgba(124,58,237,0.22) 0%, transparent 70%);
      pointer-events: none;
    }

    .auth-brand-content {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 420px;
      width: 100%;
      padding: 40px 32px;
      background: rgba(10, 12, 32, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }

    .auth-brand-logo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: contain;
      background: #fff;
      padding: 6px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.3);
      margin-bottom: 24px;
    }

    .auth-brand-name {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      line-height: 1.15;
    }

    .auth-brand-subtitle {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.85);
      font-weight: 500;
      margin-bottom: 0;
      line-height: 1.5;
    }

    /* Right auth panel */
    .auth-form-panel {
      width: 480px;
      flex-shrink: 0;
      background: var(--bg-secondary);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 48px 40px;
      border-left: 1px solid var(--border);
      overflow-y: auto;
    }

    .auth-form-header {
      margin-bottom: 28px;
    }

    .auth-form-header h1 {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .auth-form-header p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    /* Tab switcher */
    .auth-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 10px 16px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: var(--transition-fast);
      font-family: var(--font-body);
    }

    .auth-tab-btn.active {
      color: var(--accent-purple);
      border-bottom-color: var(--accent-purple);
    }

    .auth-tab-btn:hover:not(.active) {
      color: var(--text-secondary);
    }

    /* Form styling */
    .auth-panel {
      display: none;
    }

    .auth-panel.active {
      display: block;
    }

    .auth-form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .auth-footer-link {
      text-align: center;
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .auth-footer-link span {
      color: var(--accent-purple);
      cursor: pointer;
      font-weight: 600;
    }

    .auth-footer-link span:hover {
      text-decoration: underline;
    }

    /* Responsive */
    @media (max-width: 820px) {
      .auth-brand-panel {
        display: none;
      }
      .auth-form-panel {
        width: 100%;
        padding: 32px 24px;
        border-left: none;
      }
    }

    @media (max-width: 480px) {
      .auth-form-panel {
        padding: 24px 16px;
      }
      .auth-form-row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div id="toast-container"></div>

<div class="auth-page-wrapper">

  <!-- Left Branding Panel -->
  <div class="auth-brand-panel">
    <div class="auth-brand-content">
      <img src="/images/kls_git_logo.png" alt="KLS GIT Logo" class="auth-brand-logo" />
      <div class="auth-brand-name">KLS GIT<br/>Belgaum</div>
      <div class="auth-brand-subtitle">
        KLS Gogte Institute of Technology<br/>
        Campus Activity Hub
      </div>
    </div>
  </div>

  <!-- Right Auth Form Panel -->
  <div class="auth-form-panel">

    <div class="auth-form-header">
      <h1 id="auth-form-title">Welcome back</h1>
      <p id="auth-form-desc">Sign in to your campus account to continue.</p>
    </div>

    <!-- Tab switcher -->
    <div class="auth-tabs">
      <button class="auth-tab-btn active" id="tab-signin" onclick="switchAuthTab('signin')">Sign In</button>
      <button class="auth-tab-btn" id="tab-register" onclick="switchAuthTab('register')">Create Account</button>
    </div>

    <!-- Sign In Panel -->
    <div class="auth-panel active" id="auth-panel-signin">
      <form id="login-form" novalidate onsubmit="handleLogin(event); return false;">

        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">@</span>
            <input type="email" id="email" name="email" placeholder="you@college.edu" autocomplete="email" required />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper" style="position:relative;">
            <span class="input-icon" style="display:flex; align-items:center; justify-content:center; width:16px; height:16px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required style="padding-right: 44px;" />
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('password', this)" title="Show/hide password">&#128065;</button>
          </div>
        </div>

        <div class="form-group">
          <label for="role">Select Your Role</label>
          <div class="input-wrapper">
            <span class="input-icon">&#9776;</span>
            <select id="role" name="role" required>
              <option value="" disabled selected>Select Role</option>
              <option value="DEVELOPER">Developer / Admin</option>
              <option value="COORDINATOR">Coordinator</option>
              <option value="FACULTY_COORDINATOR">Faculty Coordinator</option>
              <option value="USER">Student</option>
            </select>
          </div>
        </div>

        <div id="error-msg" class="error-msg"></div>

        <button type="submit" id="login-btn" class="btn btn-primary" style="margin-top: 20px; width: 100%;">
          Sign In
        </button>
      </form>

      <p class="auth-footer-link">
        New to campus hub? <span onclick="switchAuthTab('register')">Create an account</span>
      </p>
    </div>

    <!-- Create Account Panel -->
    <div class="auth-panel" id="auth-panel-register">
      <form id="register-form" novalidate onsubmit="handleStudentRegister(event)">

        <div class="auth-form-row">
          <div class="form-group">
            <label for="reg-name">Full Name *</label>
            <div class="input-wrapper">
              <span class="input-icon">A</span>
              <input type="text" id="reg-name" placeholder="Your full name" required />
            </div>
          </div>
          <div class="form-group">
            <label for="reg-usn">USN *</label>
            <div class="input-wrapper">
              <span class="input-icon">#</span>
              <input type="text" id="reg-usn" placeholder="2KG21CS001" required style="text-transform:uppercase;" />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-email">College Email *</label>
          <div style="display:flex; gap:8px; align-items:flex-start;">
            <div class="input-wrapper" style="flex:1;">
              <span class="input-icon">@</span>
              <input type="email" id="reg-email" placeholder="usn@kls.ac.in" required />
            </div>
            <button type="button" id="otp-send-btn" onclick="sendOTP()"
              style="flex-shrink:0; padding: 10px 14px; background: var(--accent-purple); color:#fff; border:none; border-radius: var(--radius-md); cursor:pointer; font-size:0.8rem; font-weight:600; white-space:nowrap;">
              Send OTP
            </button>
          </div>
        </div>

        <div class="form-group" id="otp-verify-row" style="display:none;">
          <label for="reg-otp">Enter OTP <span style="color:var(--accent-green); font-size:0.75rem;" id="otp-status-text">(Check your email)</span></label>
          <div style="display:flex; gap:8px;">
            <div class="input-wrapper" style="flex:1;">
              <span class="input-icon">&#9166;</span>
              <input type="text" id="reg-otp" placeholder="6-digit code" maxlength="6" inputmode="numeric" />
            </div>
            <button type="button" onclick="verifyOTP()"
              style="flex-shrink:0; padding: 10px 14px; background: var(--accent-green); color:#fff; border:none; border-radius: var(--radius-md); cursor:pointer; font-size:0.8rem; font-weight:600;">
              Verify
            </button>
          </div>
          <div id="otp-verified-badge" style="display:none; margin-top:6px; color:var(--accent-green); font-size:0.78rem; font-weight:600;">
            Email Verified
          </div>
        </div>

        <div class="auth-form-row">
          <div class="form-group">
            <label for="reg-mobile">Mobile Number *</label>
            <div class="input-wrapper">
              <span class="input-icon">+91</span>
              <input type="tel" id="reg-mobile" placeholder="10-digit number" maxlength="10" required />
            </div>
          </div>
          <div class="form-group">
            <label for="reg-year">Year of Study *</label>
            <div class="input-wrapper">
              <span class="input-icon">Yr</span>
              <select id="reg-year" required>
                <option value="" disabled selected>Select Year</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-dept">Department *</label>
          <div class="input-wrapper">
            <span class="input-icon">Dept</span>
            <select id="reg-dept" required>
              <option value="" disabled selected>Select Department</option>
              <option value="CSE">Computer Science &amp; Engineering</option>
              <option value="ISE">Information Science &amp; Engineering</option>
              <option value="ECE">Electronics &amp; Communication</option>
              <option value="EEE">Electrical &amp; Electronics</option>
              <option value="ME">Mechanical Engineering</option>
              <option value="CE">Civil Engineering</option>
              <option value="AI-ML">AI &amp; Machine Learning</option>
              <option value="MBA">MBA</option>
              <option value="MCA">MCA</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="reg-password">Password *</label>
          <div class="input-wrapper" style="position:relative;">
            <span class="input-icon" style="display:flex; align-items:center; justify-content:center; width:16px; height:16px;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="reg-password" placeholder="Create a secure password" required style="padding-right: 44px;" />
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('reg-password', this)" title="Show/hide password">&#128065;</button>
          </div>
        </div>

        <div id="reg-error-msg" class="error-msg"></div>

        <button type="submit" id="register-btn" class="btn btn-primary" style="margin-top:16px; width:100%;">
          Create Account
        </button>
      </form>

      <p class="auth-footer-link">
        Already have an account? <span onclick="switchAuthTab('signin')">Sign In</span>
      </p>
    </div>

  </div>
</div>

<script src="/js/auth.js?v=20260917_v19"></script>
<script>
  // Tab switching for the standalone login page
  function switchAuthTab(tab) {
    const signinPanel  = document.getElementById('auth-panel-signin');
    const registerPanel = document.getElementById('auth-panel-register');
    const signinTab    = document.getElementById('tab-signin');
    const registerTab  = document.getElementById('tab-register');
    const formTitle    = document.getElementById('auth-form-title');
    const formDesc     = document.getElementById('auth-form-desc');

    if (tab === 'register') {
      signinPanel.classList.remove('active');
      registerPanel.classList.add('active');
      signinTab.classList.remove('active');
      registerTab.classList.add('active');
      if (formTitle) formTitle.textContent = 'Create your account';
      if (formDesc) formDesc.textContent = 'Register as a student to access campus events and activities.';
    } else {
      registerPanel.classList.remove('active');
      signinPanel.classList.add('active');
      registerTab.classList.remove('active');
      signinTab.classList.add('active');
      if (formTitle) formTitle.textContent = 'Welcome back';
      if (formDesc) formDesc.textContent = 'Sign in to your campus account to continue.';
    }
  }

  // Check URL param ?tab=register
  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    if (params.get('tab') === 'register') {
      switchAuthTab('register');
    }
    // If already logged in, redirect to dashboard
    const token = getToken();
    const role  = getRole();
    if (token && role) {
      redirectByRole();
    }
  });

  // Override openLoginModal to do nothing on this page (already showing)
  window.openLoginModal = function(tab) {
    switchAuthTab(tab || 'signin');
  };
  window.closeLoginModal = function() {};
</script>
</body>
</html>
