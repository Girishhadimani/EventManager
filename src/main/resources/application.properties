spring.application.name=EventManager

# Server Port (Binds to cloud $PORT if provided, defaults to 8080 locally)
server.port=${PORT:8080}

# PostgreSQL Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/club_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Girish@9701}

# Hibernate Setup (Updates tables automatically based on your Java code)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Secret & Expiration
jwt.secret=${JWT_SECRET:4qhq8L6lQ2Q8wQ2X7Y9V4X6b8N9Z2C4h6q8L6lQ2Q8w=}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Transactional Mail Configuration (Supports Gmail App Passwords / Sendgrid / Custom SMTP)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App Mail Switch & Default Sender
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:events@git.edu}
app.base-url=${APP_BASE_URL:http://localhost:8080}