spring.application.name=EventManager

# Server Port (Binds to cloud $PORT if provided, defaults to 8080 locally)
server.port=${PORT:8080}

# PostgreSQL Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/club_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Girish@9701}

# Hibernate Setup (Updates tables automatically based on your Java code)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Secret & Expiration
jwt.secret=${JWT_SECRET:4qhq8L6lQ2Q8wQ2X7Y9V4X6b8N9Z2C4h6q8L6lQ2Q8w=}
jwt.expiration=${JWT_EXPIRATION:86400000}