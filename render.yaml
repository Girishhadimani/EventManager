databases:
  - name: eventmanager-db
    databaseName: club_management
    user: postgres
    plan: free

services:
  - type: web
    name: event-manager
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /index.html
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: DATABASE_URL
        fromDatabase:
          name: eventmanager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: APP_MAIL_ENABLED
        value: "false"
